# WordZ: avif-decode 3.0.0 (https://github.com/kornelski/avif-decode, BSD-3-Clause), library only,
# with rav1d's assembly turned off so building needs no NASM. Opens .avif pictures.
[package]
name = "avif-decode"
version = "3.0.0"
authors = ["Kornel <kornel@geekhood.net>"]
edition = "2024"
description = "Convert AVIF images to PNG or decompressed pixel data"
license = "BSD-3-Clause"
repository = "https://github.com/kornelski/avif-decode"

[lib]
name = "avif_decode"
path = "src/lib.rs"

[dependencies]
avif-parse = "2.1.0"
bytemuck = "1.25"
imgref = "1.12.3"
log = "0.4.34"
quick-error = "2.0.1"
rgb = { version = "0.8.53", default-features = false, features = ["bytemuck"] }
yuv = "0.8.19"
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
